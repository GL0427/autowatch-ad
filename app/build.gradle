plugins {
    id 'com.android.application'
}

android {
    namespace 'com.autowatch.ad'
    compileSdk 34

    defaultConfig {
        applicationId 'com.autowatch.ad'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 纯 Java + 系统 Activity/无障碍 API，无需 appcompat，避免 kotlin-stdlib 版本冲突
}
